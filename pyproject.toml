[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pokemon-codesign-env"
version = "0.1.0"
description = "Pokemon Showdown co-design environment: joint team design (embodiment) and battle policy (control) learning."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Aviraj Newatia" }]
keywords = [
    "pokemon",
    "pokemon-showdown",
    "reinforcement-learning",
    "co-design",
    "gymnasium",
    "multi-agent",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "poke-env>=0.15.0",
    "gymnasium>=1.0.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
rl = [
    "nevergrad>=1.0",
    "torch>=2.1",
    "stable-baselines3>=2.3",
    "tqdm>=4.66",
    "wandb>=0.19",
    "pyyaml>=6.0",
    "matplotlib>=3.7"
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.urls]
Homepage = "https://github.com/camral/pokemon-codesign-env"
Repository = "https://github.com/camral/pokemon-codesign-env"
Issues = "https://github.com/camral/pokemon-codesign-env/issues"

[project.scripts]
pokemon-codesign-install-showdown = "pokemon_codesign_env.showdown_extension.install:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pokemon_codesign_env.envs" = ["leagues/*.json"]
"pokemon_codesign_env.showdown_extension" = ["*.ts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
